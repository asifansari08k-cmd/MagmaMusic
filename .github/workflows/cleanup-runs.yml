name: Clean Old VC Music Bot Runs

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete Completed Runs
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          echo "🧹 Cleanup started..."

          gh api --paginate \
            "/repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name == "VC Music Bot Runner") | .id' |
          while read workflow_id; do

            gh api --paginate \
              "/repos/${{ github.repository }}/actions/workflows/$workflow_id/runs?per_page=100" \
              --jq '.workflow_runs[]
                | select(.status == "completed")
                | .id' |
            while read run_id; do

              echo "🗑️ Deleting completed Run #$run_id..."

              if gh api --method DELETE \
                "/repos/${{ github.repository }}/actions/runs/$run_id"; then
                echo "✅ Deleted Run #$run_id"
              else
                echo "❌ Failed Run #$run_id"
              fi

            done
          done

          echo "🎉 Cleanup finished!"