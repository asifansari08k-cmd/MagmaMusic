name: Clean Old VC Music Bot Runs

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          echo "🔍 Starting cleanup..."

          gh api --paginate \
            "/repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name == "VC Music Bot Runner") | .id' |
          while read workflow_id; do

            gh api --paginate \
              "/repos/${{ github.repository }}/actions/workflows/$workflow_id/runs?per_page=100" \
              --jq '.workflow_runs[]
                | select(
                    .status != "in_progress"
                    and .status != "queued"
                    and .status != "waiting"
                    and .status != "requested"
                    and .status != "pending"
                  )
                | [.id, .status, .conclusion] | @tsv' |
            while IFS=$'\t' read -r run_id status conclusion; do

              echo "🗑️ Deleting Run #$run_id | Status: $status | Result: $conclusion"

              if gh api --method DELETE \
                "/repos/${{ github.repository }}/actions/runs/$run_id" \
                >/dev/null 2>&1; then
                echo "✅ Deleted Run #$run_id"
              else
                echo "❌ Failed to delete Run #$run_id"
              fi

            done
          done

          echo "🎉 Cleanup finished!"