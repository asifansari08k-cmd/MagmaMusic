name: Auto Restart VC Music Bot

on:
  workflow_run:
    workflows:
      - "VC Music Bot Runner"
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart:
    if: >
      ${{
        github.event.workflow_run.conclusion == 'success' ||
        github.event.workflow_run.conclusion == 'failure' ||
        github.event.workflow_run.conclusion == 'cancelled' ||
        github.event.workflow_run.conclusion == 'timed_out'
      }}

    runs-on: ubuntu-latest

    steps:
      - name: Wait for Previous Run to Fully Close
        run: |
          echo "Previous VC Music Bot run completed."
          echo "Waiting 30 seconds..."
          sleep 30

      - name: Start Next VC Music Bot Run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Starting next VC Music Bot run..."

          gh workflow run "VC Music Bot Runner" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.event.repository.default_branch }}"

          echo "Next VC Music Bot run started successfully."