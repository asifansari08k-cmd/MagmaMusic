name: Auto Restart VC Music Bot

on:
  workflow_run:
    workflows: ["VC Music Bot Runner"]
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  restart-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Wait Before Restart
        run: sleep 20

      - name: Start Next Bot Run
        env:
          GH_TOKEN: ${{ secrets.GH_PERSONAL_TOKEN }}
        run: |
          echo "Previous VC Music Bot run completed."
          echo "Starting next VC Music Bot run..."

          gh workflow run "VC Music Bot Runner" \
            --repo "${{ github.repository }}" \
            --ref main

          echo "✅ Next VC Music Bot run triggered successfully."